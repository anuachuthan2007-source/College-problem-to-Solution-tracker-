<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Problem to Solution Tracker</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="login-container">

        <div class="login-box">

            <h1>Problem to Solution</h1>

            <p class="subtitle">
                College Problem Management Platform
            </p>


            <h2>Login</h2>


            <form id="loginForm">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <p id="message"></p>


            <p class="register-text">

                Don't have an account?

                <a href="#" id="registerLink">
                    Register
                </a>

            </p>


        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
