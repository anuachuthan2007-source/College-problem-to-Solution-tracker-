<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Suggest a Solution</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="report-page">

    <div class="login-container">

        <div class="login-box">

            <h1>Suggest a Solution</h1>

            <p class="subtitle">
                Share your idea to solve this college problem
            </p>


            <div class="welcome-section">

                <h3>Classroom Projector Not Working</h3>

                <p>
                    The projector in the classroom is not working
                    properly during lectures.
                </p>

            </div>


            <form id="solutionForm">

                <label>Your Solution</label>

                <textarea
                    id="solution"
                    placeholder="Describe your solution..."
                    rows="6"
                    required
                ></textarea>


                <button type="submit">
                    Submit Solution
                </button>

            </form>


            <p id="solutionMessage"></p>


            <p class="register-text">

                <a href="problems.html">
                    ← Back to Problems
                </a>

            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
